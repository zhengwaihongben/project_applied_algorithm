[project]
name = "project-applied-algorithm"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "chronos-forecasting>=2.3.2",
    "ercot>=0.1.2",
    "matplotlib>=3.11.2",
    "pandas>=2.2,<3",
    "pandas-stubs~=2.3.3",
    "tabpfn-time-series>=1.4.0",
    "timesfm>=3.0.2",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
